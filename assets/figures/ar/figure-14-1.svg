<text x="329.601" y="19.148" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="10.57" fill="rgb(13.328552%, 13.328552%, 13.328552%)" text-anchor="start" direction="rtl" font-weight="bold">المحلّي</text>
<text x="329.601" y="32.039" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="8.2" fill="rgb(13.328552%, 13.328552%, 13.328552%)" text-anchor="start" direction="rtl">تصحيحاتك، حلولك الالتفافية، أتمتتك، تجاوزات policy لديك</text>
<text x="329.601" y="42.064" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="7.64" fill="rgb(39.99939%, 39.99939%, 39.99939%)" text-anchor="start" direction="rtl" font-style="italic">تصونها وتختبرها أنت — أبقِ هذه الطبقة أرقّ ما يمكن</text>
<text x="329.601" y="69.277" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="10.57" fill="rgb(13.328552%, 13.328552%, 13.328552%)" text-anchor="start" direction="rtl" font-weight="bold">التوزيعة</text>
<text x="329.601" y="82.167" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="7.6" fill="rgb(13.328552%, 13.328552%, 13.328552%)" text-anchor="start" direction="rtl">سلسلة مثبَّتة، نقل خلفي من المورّد، أداة نشر، مسار ترقية، دعم</text>
<text x="329.601" y="92.193" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="7.64" fill="rgb(39.99939%, 39.99939%, 39.99939%)" text-anchor="start" direction="rtl" font-style="italic">يصونها ويختبرها المورّد</text>
<text x="329.601" y="119.405" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="10.57" fill="rgb(13.328552%, 13.328552%, 13.328552%)" text-anchor="start" direction="rtl" font-weight="bold">منبع OpenStack</text>
<text x="329.601" y="132.295" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="8.2" fill="rgb(13.328552%, 13.328552%, 13.328552%)" text-anchor="start" direction="rtl">سلاسل الإصدارات (Maintained ← Unmaintained ← EOL)، إيقاع SLURP، النقل الخلفي</text>
<text x="329.601" y="142.321" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="7.64" fill="rgb(39.99939%, 39.99939%, 39.99939%)" text-anchor="start" direction="rtl" font-style="italic">يصونها ويختبرها المجتمع</text>
<text x="339.150" y="161.895" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="8.2" fill="rgb(13.328552%, 13.328552%, 13.328552%)" text-anchor="start" direction="rtl" font-style="italic">«البقاء أقرب ما يمكن إلى المنبع» يعني: معرفة الطبقة التي يعيش فيها</text>
<text x="339.150" y="171.920" font-family="Noto Sans Arabic, Noto Kufi Arabic, Liberation Sans, Arial, sans-serif" font-size="8.2" fill="rgb(13.328552%, 13.328552%, 13.328552%)" text-anchor="start" direction="rtl" font-style="italic">كلّ انحراف، ومن يحمله.</text>
